services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/logistics
      SPRING_DATASOURCE_USERNAME: logistics
      SPRING_DATASOURCE_PASSWORD: logistics
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: MySuperSecretKeyForJwtTokenThatIsLongEnough123456
      APP_JWT_EXPIRATION_MS: 86400000
    depends_on:
      - db

volumes:
  pgdata: